<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Accounting Chatbot</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #0F1B2D;
      --panel:      #1E3A5F;
      --panel-dark: #162d4a;
      --gold:       #C9A84C;
      --gold-dim:   #8a6f2e;
      --text:       #F0EDE6;
      --text-muted: #8FA8C0;
      --user-bg:    #1E3A5F;
      --bot-bg:     #162d4a;
      --sql-bg:     #0a1520;
      --border:     #2a4a6b;
      --error:      #c0392b;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      line-height: 1.6;
    }

    /* ── Layout ── */
    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 820px;
      margin: 0 auto;
    }

    /* ── Header ── */
    header {
      padding: 20px 24px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }

    .header-icon {
      width: 36px;
      height: 36px;
      background: var(--gold);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .header-text h1 {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.01em;
    }

    .header-text p {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 300;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #2ecc71;
      border-radius: 50%;
      margin-left: auto;
      flex-shrink: 0;
      box-shadow: 0 0 6px #2ecc71;
    }

    /* ── Chat window ── */
    .chat-window {
      flex: 1;
      overflow-y: auto;
      padding: 24px 24px 8px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    /* ── Messages ── */
    .message {
      display: flex;
      flex-direction: column;
      gap: 4px;
      animation: fadeUp 0.2s ease;

     }


    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message-label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 0 4px;
    }

    .message.user .message-label { color: var(--gold-dim); }

    .message-bubble {
      padding: 14px 18px;
      border-radius: 10px;
      line-height: 1.65;
      font-size: 14px;
    }

    .message.user .message-bubble {
      background: var(--user-bg);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .message.bot .message-bubble {
      background: var(--bot-bg);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .message.error .message-bubble {
      background: rgba(192, 57, 43, 0.12);
      border: 1px solid var(--error);
      color: #e74c3c;
    }

    /* ── SQL toggle panel ── */
    .sql-toggle {
      margin-top: 8px;
    }

    .sql-toggle-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: border-color 0.15s, color 0.15s;
    }

    .sql-toggle-btn:hover {
      border-color: var(--gold-dim);
      color: var(--gold);
    }

    .sql-toggle-btn .arrow {
      display: inline-block;
      transition: transform 0.2s;
    }

    .sql-toggle-btn.open .arrow {
      transform: rotate(90deg);
    }

    .sql-panel {
      display: none;
      margin-top: 8px;
      background: var(--sql-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .sql-panel.visible { display: block; }

    .sql-panel-label {
      padding: 8px 14px;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--gold-dim);
      border-bottom: 1px solid var(--border);
      background: rgba(201, 168, 76, 0.05);
    }

    .sql-panel pre {
      padding: 14px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      color: #7ec8e3;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.7;
    }

    /* ── Thinking indicator ── */
    .thinking {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 18px;
      background: var(--bot-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-muted);
      font-size: 13px;
    }

    .thinking-dots {
      display: flex;
      gap: 4px;
    }

    .thinking-dots span {
      width: 5px;
      height: 5px;
      background: var(--gold);
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
    .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40%            { transform: translateY(-5px); opacity: 1; }
    }

    /* ── Suggested questions ── */
    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 4px;
    }

    .suggestion-chip {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .suggestion-chip:hover {
      border-color: var(--gold-dim);
      color: var(--text);
      background: rgba(201, 168, 76, 0.06);
    }

    /* ── Input area ── */
    .input-area {
      padding: 16px 24px 24px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    textarea {
      flex: 1;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      padding: 12px 16px;
      resize: none;
      min-height: 48px;
      max-height: 140px;
      outline: none;
      transition: border-color 0.15s;
      line-height: 1.5;
    }

    textarea::placeholder { color: var(--text-muted); }

    textarea:focus { border-color: var(--gold-dim); }

    .send-btn {
      width: 48px;
      height: 48px;
      background: var(--gold);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
    }

    .send-btn:hover { background: #d4b05a; }
    .send-btn:active { transform: scale(0.95); }
    .send-btn:disabled { background: var(--border); cursor: not-allowed; }

    .send-btn svg {
      width: 18px;
      height: 18px;
      fill: var(--bg);
    }

    .input-hint {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 8px;
      padding: 0 4px;
    }
  </style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <header>
    <div class="header-icon">📒</div>
    <div class="header-text">
      <h1>Accounting Assistant</h1>
      <p>Ask questions about your ledger data in plain English</p>
    </div>
    <div class="status-dot" title="Backend connected"></div>
  </header>

  <!-- Chat window -->
  <div class="chat-window" id="chatWindow">

    <!-- Welcome message -->
    <div class="message bot">
      <div class="message-label">Assistant</div>
      <div class="message-bubble">
        Hello! I can answer questions about your accounting data — branches, ledgers, expenses, GST, customers, vendors, and more. Try one of these to get started:
      </div>
    </div>

    <!-- Suggested questions -->
    <div class="suggestions" id="suggestions">
      <button class="suggestion-chip" onclick="sendSuggestion(this)">Total GST liability across all branches</button>
      <button class="suggestion-chip" onclick="sendSuggestion(this)">Top 5 customers by debit amount</button>
      <button class="suggestion-chip" onclick="sendSuggestion(this)">Total indirect expense for Padup Ventures</button>
      <button class="suggestion-chip" onclick="sendSuggestion(this)">Which branches have the highest expenses?</button>
    </div>

  </div>

  <!-- Input -->
  <div class="input-area">
    <div class="input-row">
      <textarea
        id="questionInput"
        placeholder="Ask about your accounting data..."
        rows="1"
        onkeydown="handleKey(event)"
        oninput="autoResize(this)"
      ></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendQuestion()" title="Send">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/>
        </svg>
      </button>
    </div>
    <div class="input-hint">Enter to send · Shift+Enter for new line</div>
  </div>

</div>

<script>
  const BACKEND_URL = "http://127.0.0.1:8000/ask";

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 140) + 'px';
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendQuestion();
    }
  }

  function sendSuggestion(btn) {
    document.getElementById('questionInput').value = btn.textContent;
    // Hide suggestions after first use
    document.getElementById('suggestions').style.display = 'none';
    sendQuestion();
  }

  function scrollToBottom() {
    const w = document.getElementById('chatWindow');
    w.scrollTop = w.scrollHeight;
  }

  function appendMessage(role, content, sql) {
    const window = document.getElementById('chatWindow');

    const msg = document.createElement('div');
    msg.className = `message ${role}`;

    const label = document.createElement('div');
    label.className = 'message-label';
    label.textContent = role === 'user' ? 'You' : 'Assistant';

    const bubble = document.createElement('div');
    bubble.className = 'message-bubble';
    bubble.innerHTML = simpleMarkdown(content);

    msg.appendChild(label);
    msg.appendChild(bubble);

    // SQL toggle — only for bot messages with SQL
    if (role === 'bot' && sql) {
      const toggleWrap = document.createElement('div');
      toggleWrap.className = 'sql-toggle';

      const toggleBtn = document.createElement('button');
      toggleBtn.className = 'sql-toggle-btn';
      toggleBtn.innerHTML = '<span class="arrow">▶</span> View generated SQL';

      const panel = document.createElement('div');
      panel.className = 'sql-panel';
      panel.innerHTML = `
        <div class="sql-panel-label">Generated SQL</div>
        <pre>${escapeHtml(sql)}</pre>
      `;

      toggleBtn.onclick = () => {
        const isOpen = panel.classList.toggle('visible');
        toggleBtn.classList.toggle('open', isOpen);
        toggleBtn.innerHTML = isOpen
          ? '<span class="arrow" style="transform:rotate(90deg)">▶</span> Hide SQL'
          : '<span class="arrow">▶</span> View generated SQL';
      };

      toggleWrap.appendChild(toggleBtn);
      toggleWrap.appendChild(panel);
      msg.appendChild(toggleWrap);
    }

    window.appendChild(msg);
    scrollToBottom();
    return msg;
  }

  function appendThinking() {
    const window = document.getElementById('chatWindow');
    const div = document.createElement('div');
    div.className = 'message bot';
    div.id = 'thinkingIndicator';
    div.innerHTML = `
      <div class="message-label">Assistant</div>
      <div class="thinking">
        <div class="thinking-dots">
          <span></span><span></span><span></span>
        </div>
        Analysing your question...
      </div>
    `;
    window.appendChild(div);
    scrollToBottom();
    return div;
  }

  function escapeHtml(text) {
    return text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }
  function simpleMarkdown(text) {
  return text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>')
    .replace(/\n/g, '<br>');
}

  async function sendQuestion() {
    const input = document.getElementById('questionInput');
    const sendBtn = document.getElementById('sendBtn');
    const question = input.value.trim();

    if (!question) return;

    // Hide suggestions permanently after first question
    document.getElementById('suggestions').style.display = 'none';

    // Show user message
    appendMessage('user', question);

    // Clear input
    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;

    // Show thinking indicator
    const thinking = appendThinking();

    try {
      const response = await fetch(BACKEND_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question })
      });

      const data = await response.json();

      // Remove thinking indicator
      thinking.remove();

      if (!response.ok) {
        appendMessage('error', `Error: ${data.detail || 'Something went wrong.'}`, null);
      } else {
        appendMessage('bot', data.answer, data.sql);
      }

    } catch (err) {
      thinking.remove();
      appendMessage('error',
        'Could not reach the backend. Make sure the FastAPI server is running on port 8000.',
        null
      );
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }
</script>
</body>
</html>
